<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제출 현황 — 2026 상반기 사역결산 (관리자)</title>
<style>
  :root{
    --brown:#6B3A1C; --brown-light:#8B5E3C; --brown-pale:#F5EDE7;
    --line:#E3D9D0; --text:#222; --sub:#8a7c70; --green:#2e7d32; --red:#B3261E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#FAF7F4;color:var(--text);line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 16px 60px}

  /* 로그인 */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .login-card{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 6px 24px rgba(107,58,28,.08)}
  .login-card h1{font-size:20px;color:var(--brown);margin-bottom:4px}
  .login-card p{font-size:13px;color:var(--sub);margin-bottom:22px}
  .login-card label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
  .login-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  .login-card input:focus{outline:none;border-color:var(--brown-light)}
  .btn{width:100%;margin-top:22px;padding:13px;background:var(--brown);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
  .btn:hover{background:#5a3017}
  .login-err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}

  /* 대시보드 */
  #dash{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .top h1{font-size:22px;color:var(--brown)}
  .top .sub{font-size:13px;color:var(--sub);margin-top:2px}
  .top-actions{display:flex;gap:8px}
  .ghost{padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;cursor:pointer;color:var(--text)}
  .ghost:hover{background:var(--brown-pale)}

  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .chip{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .chip .n{font-size:26px;font-weight:700}
  .chip .l{font-size:12px;color:var(--sub);margin-top:2px}
  .chip.done .n{color:var(--green)} .chip.miss .n{color:var(--red)} .chip.all .n{color:var(--brown)}

  .bar{height:10px;background:var(--brown-pale);border-radius:6px;overflow:hidden;margin-bottom:24px}
  .bar > i{display:block;height:100%;background:var(--green);transition:width .4s}

  h2{font-size:15px;color:var(--brown);margin:8px 0 10px;display:flex;align-items:center;gap:6px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#F0F0F0;font-weight:600;font-size:12px;color:#555}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FAF7F4}
  td.num{color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.leader{font-weight:600}
  td.time{color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
  a.open{color:var(--brown-light);text-decoration:none;font-weight:600}
  a.open:hover{text-decoration:underline}

  .miss-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .miss-item{background:#fff;border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;padding:8px 12px;font-size:13px}
  .empty{color:var(--sub);font-size:13px;padding:14px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:10px}
  .loading{text-align:center;color:var(--sub);padding:40px;font-size:14px}
  .section{margin-bottom:28px}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
  <form class="login-card" onsubmit="return doLogin(event)">
    <h1>관리자 로그인</h1>
    <p>2026 상반기 사역결산 제출 현황</p>
    <label>아이디</label>
    <input id="uid" autocomplete="username" autofocus>
    <label>비밀번호</label>
    <input id="upw" type="password" autocomplete="current-password">
    <button class="btn" type="submit">로그인</button>
    <div class="login-err" id="login-err"></div>
  </form>
</div>

<!-- 대시보드 -->
<div id="dash"><div class="wrap">
  <div class="top">
    <div>
      <h1>📋 제출 현황</h1>
      <div class="sub">2026 상반기 사역결산 &amp; 계획보고</div>
    </div>
    <div class="top-actions">
      <button class="ghost" onclick="loadData()">↻ 새로고침</button>
      <button class="ghost" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="chips">
    <div class="chip all"><div class="n" id="c-all">–</div><div class="l">전체 부서·기관</div></div>
    <div class="chip done"><div class="n" id="c-done">–</div><div class="l">제출 완료</div></div>
    <div class="chip miss"><div class="n" id="c-miss">–</div><div class="l">미제출</div></div>
  </div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>

  <div id="body">
    <div class="loading">불러오는 중…</div>
  </div>
</div></div>

<script>
// ── 설정 ───────────────────────────────────────────
const DRIVE_URL  = 'https://script.google.com/macros/s/AKfycby-l5_JKGolEEqV-37eqAjC7-2SQM95-X6Tl6J0yRn5y6pHwo9eps9zGLsk2LXv-PDi_Q/exec';
const LIST_TOKEN = 'meslap2026';     // 목록 조회용 간이 토큰 (Apps Script와 동일해야 함)
const ADMIN_ID   = 'admin';
const ADMIN_PW   = 'admin123';

// 전체 부서·기관·팀 마스터 목록 (index.html 드롭다운과 동일)
const ALL_UNITS = [
  '01|예배부','01가|예배부/다윗성가대','01나|예배부/찬양팀','02|교육부','03|재정부',
  '04|새가족부','05|시설관리부','06|환경미화부','07|경조사부','08|친교봉사부',
  '09|문화사역팀','10|여름수련회','11|문서사역팀','12|방송사역팀','13|미디어사역팀',
  '기01|1장년 남선교회','기02|1장년 여선교회','기03|2장년 선교회','기04|1,2청년부','기05|3청년부','기06|NGC'
];
// 'no|name' → 'no name' (서버가 저장하는 dept 문자열 형식과 일치)
const unitKey = (v) => v.replace('|',' ');

// ── 로그인 ─────────────────────────────────────────
function doLogin(e){
  e.preventDefault();
  const id=document.getElementById('uid').value.trim();
  const pw=document.getElementById('upw').value;
  if(id===ADMIN_ID && pw===ADMIN_PW){
    sessionStorage.setItem('meslap_admin','1');
    showDash();
  } else {
    document.getElementById('login-err').textContent='아이디 또는 비밀번호가 올바르지 않습니다.';
  }
  return false;
}
function logout(){ sessionStorage.removeItem('meslap_admin'); location.reload(); }
function showDash(){
  document.getElementById('login').style.display='none';
  document.getElementById('dash').style.display='block';
  loadData();
}

// ── 데이터 로드 ────────────────────────────────────
async function loadData(){
  const body=document.getElementById('body');
  body.innerHTML='<div class="loading">불러오는 중…</div>';
  try{
    const res=await fetch(`${DRIVE_URL}?action=list&token=${encodeURIComponent(LIST_TOKEN)}`);
    const out=await res.json();
    if(!out.ok) throw new Error(out.error||'조회 실패');
    render(out.submissions||[]);
  }catch(err){
    body.innerHTML=`<div class="empty">목록을 불러오지 못했습니다.<br>${String(err)}<br><br>Apps Script가 목록 조회(action=list)를 지원하도록 재배포되었는지 확인하세요.</div>`;
  }
}

// 서버 제출목록 → 부서키 기준 맵 (재제출 대비 최신만)
function render(subs){
  const byKey={};
  subs.forEach(s=>{
    const key=(s.dept||'').trim();
    if(!byKey[key] || (s.time||'') > (byKey[key].time||'')) byKey[key]=s;
  });

  const submitted=[], missing=[];
  ALL_UNITS.forEach(v=>{
    const key=unitKey(v);
    if(byKey[key]) submitted.push({unit:v, ...byKey[key]});
    else missing.push(v);
  });

  // 요약
  document.getElementById('c-all').textContent=ALL_UNITS.length;
  document.getElementById('c-done').textContent=submitted.length;
  document.getElementById('c-miss').textContent=missing.length;
  document.getElementById('bar').style.width=Math.round(submitted.length/ALL_UNITS.length*100)+'%';

  // 제출 외 기타(목록에 없는 이름으로 들어온 제출)도 표시
  const known=new Set(ALL_UNITS.map(unitKey));
  const extra=Object.values(byKey).filter(s=>!known.has((s.dept||'').trim()));

  let html='';

  // 제출 완료 표
  html+=`<div class="section"><h2>✅ 제출 완료 (${submitted.length})</h2>`;
  if(submitted.length){
    html+=`<table><thead><tr><th>번호</th><th>부서 / 기관</th><th>작성자(부서장)</th><th>제출시각</th><th>PPT</th></tr></thead><tbody>`;
    submitted.forEach(s=>{
      const [no,name]=s.unit.split('|');
      html+=`<tr>
        <td class="num">${esc(no)}</td>
        <td>${esc(name)}</td>
        <td class="leader">${esc(s.leader||'-')}</td>
        <td class="time">${esc(s.time||'-')}</td>
        <td>${s.url?`<a class="open" href="${esc(s.url)}" target="_blank" rel="noopener">열기 ↗</a>`:'-'}</td>
      </tr>`;
    });
    html+=`</tbody></table>`;
  } else {
    html+=`<div class="empty">아직 제출된 부서가 없습니다.</div>`;
  }
  html+=`</div>`;

  // 기타 제출(마스터 목록 외)
  if(extra.length){
    html+=`<div class="section"><h2>ℹ️ 기타 제출 (목록 외 이름)</h2><table><thead><tr><th>부서 / 기관</th><th>작성자</th><th>제출시각</th><th>PPT</th></tr></thead><tbody>`;
    extra.forEach(s=>{
      html+=`<tr><td>${esc(s.dept||'-')}</td><td class="leader">${esc(s.leader||'-')}</td><td class="time">${esc(s.time||'-')}</td><td>${s.url?`<a class="open" href="${esc(s.url)}" target="_blank" rel="noopener">열기 ↗</a>`:'-'}</td></tr>`;
    });
    html+=`</tbody></table></div>`;
  }

  // 미제출
  html+=`<div class="section"><h2>⛔ 미제출 (${missing.length})</h2>`;
  if(missing.length){
    html+=`<div class="miss-list">`;
    missing.forEach(v=>{ const [no,name]=v.split('|'); html+=`<span class="miss-item">${esc(no)} ${esc(name)}</span>`; });
    html+=`</div>`;
  } else {
    html+=`<div class="empty">🎉 모든 부서·기관이 제출을 완료했습니다!</div>`;
  }
  html+=`</div>`;

  document.getElementById('body').innerHTML=html;
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 세션 유지
if(sessionStorage.getItem('meslap_admin')==='1') showDash();
</script>
</body>
</html>
